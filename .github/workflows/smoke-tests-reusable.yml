name: Smoke tests (reusable)

on:
  workflow_call:

jobs:
  smoke-tests:
    name: Smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven

      - name: Set up Maven 3.9
        uses: stCarolas/setup-maven@v7
        with:
          maven-version: '3.9.6'

      - name: Run smoke tests
        run: make test-smoke
        env:
          ENV_TEST_PROPERTY: '1test1'
          SPRING_PROFILES_ACTIVE: test
          NO_COLOR: '1'
          JWT_SECRET_KEY: test-jwt-secret-key-with-sufficient-length-for-hs256-algorithm
