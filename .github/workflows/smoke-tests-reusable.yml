name: Smoke tests (reusable)

on:
  workflow_call:

permissions: {}

jobs:
  smoke-tests:
    name: Smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 24
        uses: actions/setup-java@v5
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: maven

      - name: Set up Maven 3.9
        uses: stCarolas/setup-maven@1d56b37995622db66cce1214d81014b09807fb5a # v4
        with:
          maven-version: '3.9.16'

      - name: Run smoke tests
        run: make test
        env:
          ENV_TEST_PROPERTY: '1test1'
          SPRING_PROFILES_ACTIVE: test
          NO_COLOR: '1'
