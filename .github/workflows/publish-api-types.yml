name: 🔷 Publish API Types to GitHub Packages

# GitOps: the committed openapi.json is the contract / source of truth.
# Changing it on main is what triggers a new types package release.
#   make openapi  ->  git commit openapi.json  ->  push  ->  publish here.
on:
  push:
    branches: [main]
    paths:
      - 'openapi.json'
      - 'types-package/**'
      - '.github/workflows/publish-api-types.yml'

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Required to publish to GitHub Packages

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v5

      - name: 📦 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@kacper-ksiazek'

      - name: 🔧 Generate TypeScript types
        run: npx openapi-typescript@^7.0.0 openapi.json -o types.ts

      - name: 📦 Prepare NPM package
        run: |
          COMMITTED_VERSION="$(jq -r '.version' types-package/package.json)"
          if [ "$COMMITTED_VERSION" != "0.0.0" ]; then
            echo "::error::types-package/package.json version must stay 0.0.0 (CI placeholder). Found ${COMMITTED_VERSION}. Do not bump it manually — CI stamps 1.0.<workflow-run-number> at publish time."
            exit 1
          fi

          mkdir -p npm-package
          cp types.ts npm-package/
          cp types-package/README.md npm-package/
          cp types-package/package.json npm-package/

      - name: 🏷️ Stamp package version
        id: version
        working-directory: npm-package
        run: |
          VERSION="1.0.${{ github.run_number }}"
          jq --arg version "$VERSION" '.version = $version' package.json > package.json.tmp
          mv package.json.tmp package.json
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Publishing version: $VERSION"

      - name: 🚀 Publish to GitHub Packages
        working-directory: npm-package
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if npm view "@kacper-ksiazek/ord-api-types@${VERSION}" version --registry https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "Version ${VERSION} is already on the registry — skipping publish (safe re-run)."
            exit 0
          fi
          npm publish
