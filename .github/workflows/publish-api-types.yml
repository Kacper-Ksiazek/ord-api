name: 🔷 Publish API Types to GitHub Packages

# GitOps: the committed openapi.json is the contract / source of truth.
# Changing it on main is what triggers a new types package release.
#   make openapi  ->  git commit openapi.json  ->  push  ->  publish here.
on:
  push:
    branches: [main]
    paths:
      - 'openapi.json'
      - 'types-package/**'
      - '.github/workflows/publish-api-types.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # Required to publish to GitHub Packages

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: 📦 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@kacper-ksiazek'

      - name: 🔧 Generate TypeScript types
        run: npx openapi-typescript@^7.0.0 openapi.json -o types.ts

      - name: 📦 Prepare NPM package
        run: |
          mkdir -p npm-package
          cp types.ts npm-package/
          cp types-package/README.md npm-package/
          cp types-package/package.json npm-package/

      - name: 🏷️ Update package version
        working-directory: npm-package
        run: |
          VERSION="1.0.${{ github.run_number }}"
          npm version "$VERSION" --no-git-tag-version
          echo "Publishing version: $VERSION"

      - name: 🚀 Publish to GitHub Packages
        working-directory: npm-package
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
