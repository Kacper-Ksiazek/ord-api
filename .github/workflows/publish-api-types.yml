name: Publish API Types to NPM

on:
  push:
    branches: [main]
    paths:
      - 'src/main/kotlin/**/*.kt'
      - 'pom.xml'
      - '.github/workflows/publish-api-types.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create releases and tags

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: 'maven'

      - name: ⚙️ Set up Maven 3.9
        uses: stCarolas/setup-maven@v4
        with:
          maven-version: '3.9.6'

      - name: 📦 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: 🔨 Build application
        run: mvn clean package -DskipTests

      - name: 🚀 Start application in background
        run: |
          java -jar target/*.jar &
          echo "Waiting for application to start..."
          sleep 45

      - name: ✅ Verify application is running
        run: |
          curl --retry 10 --retry-delay 3 --retry-connrefused http://localhost:8080/api/v1/health-check || exit 1

      - name: 📄 Export OpenAPI specification
        env:
          SWAGGER_USERNAME: admin
          SWAGGER_PASSWORD: admin
        run: |
          chmod +x ./export-openapi-spec.sh
          ./export-openapi-spec.sh

      - name: 🔧 Generate TypeScript types
        run: |
          npx openapi-typescript@^7.0.0 openapi.json -o types.ts

      - name: 📦 Prepare NPM package
        run: |
          mkdir -p npm-package
          cp types.ts npm-package/
          cp types-package/README.md npm-package/
          cp types-package/package.json npm-package/

      - name: 🏷️ Update package version
        working-directory: npm-package
        run: |
          VERSION="1.0.${{ github.run_number }}"
          npm version $VERSION --no-git-tag-version
          echo "📦 Publishing version: $VERSION"

      - name: 🚀 Publish to NPM
        working-directory: npm-package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: 🎉 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ord-api-types-v1.0.${{ github.run_number }}
          name: 🔷 ORD API Types v1.0.${{ github.run_number }}
          body: |
            🎉 Automatically generated TypeScript types for ORD API

            **NPM Package:** `@ord-api/ord-api-types@1.0.${{ github.run_number }}`

            Install with npm:
            ```bash
            npm install @ord-api/ord-api-types@1.0.${{ github.run_number }}
            ```

            Install with pnpm:
            ```bash
            pnpm add @ord-api/ord-api-types@1.0.${{ github.run_number }}
            ```

            Or install the latest version:
            ```bash
            npm install @ord-api/ord-api-types@latest
            pnpm add @ord-api/ord-api-types@latest
            ```
          draft: false
          prerelease: false
