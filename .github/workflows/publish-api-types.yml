name: 🔷 Publish API Types to NPM

on:
  push:
    paths:
      - 'src/main/kotlin/**/*.kt'
      - 'pom.xml'
      - '.github/workflows/publish-api-types.yml'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC authentication with npm
      contents: write  # Required to create releases and tags

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Set up JDK 24
        uses: actions/setup-java@v4
        with:
          java-version: '24'
          distribution: 'temurin'
          cache: 'maven'

      - name: ⚙️ Set up Maven 3.9
        uses: stCarolas/setup-maven@v4
        with:
          maven-version: '3.9.6'

      - name: 📦 Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🔄 Update npm to support OIDC
        run: npm install -g npm@latest

      - name: 🔨 Build application (skip tests)
        run: mvn clean package -DskipTests

      - name: 🚀 Start application with CI/CD profile
        env:
          SPRING_PROFILES_ACTIVE: cicd
        run: |
          java -jar target/*.jar &
          echo "Waiting for application to start..."

          # Initial wait to allow application to begin startup
          sleep 10

          # Poll health check endpoint for up to 60 seconds
          for i in {1..30}; do
            if curl --silent --fail http://localhost:8080/api/v1/health-check; then
              echo "✅ Application is up and running!"
              exit 0
            fi
            echo "Attempt $i/30: Application not ready yet, waiting..."
            sleep 2
          done

          # Fail if application didn't start within 60 seconds
          echo "❌ Application failed to start within 60 seconds"
          exit 1

      - name: 📄 Export OpenAPI specification
        env:
          SWAGGER_USERNAME: admin
          SWAGGER_PASSWORD: admin
        run: |
          chmod +x ./export-openapi-spec.sh
          ./export-openapi-spec.sh

      - name: 🔧 Generate TypeScript types
        run: |
          npx openapi-typescript@^7.0.0 openapi.json -o types.ts

      - name: 📦 Prepare NPM package
        run: |
          mkdir -p npm-package
          cp types.ts npm-package/
          cp types-package/README.md npm-package/
          cp types-package/package.json npm-package/

      - name: 🔐 Configure npm for OIDC
        working-directory: npm-package
        run: |
          # Verify npm version supports OIDC
          npm --version

          # Configure npm for OIDC authentication
          npm config set registry https://registry.npmjs.org/

          # Debug: Show OIDC environment
          echo "ACTIONS_ID_TOKEN_REQUEST_URL: ${ACTIONS_ID_TOKEN_REQUEST_URL:-not set}"
          echo "ACTIONS_ID_TOKEN_REQUEST_TOKEN: ${ACTIONS_ID_TOKEN_REQUEST_TOKEN:+set}"
          echo "GitHub repository: ${{ github.repository }}"
          echo "Workflow: ${{ github.workflow }}"

      - name: 🏷️ Update package version
        working-directory: npm-package
        run: |
          VERSION="1.0.${{ github.run_number }}"
          npm version $VERSION --no-git-tag-version
          echo "📦 Publishing version: $VERSION"

      - name: 🚀 Publish to NPM
        working-directory: npm-package
        run: npm publish --access public

      - name: 🎉 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ord-api-types-v1.0.${{ github.run_number }}
          name: ORD API Types v1.0.${{ github.run_number }}
          body: |
            🎉 Automatically generated TypeScript types for ORD API

            **NPM Package:** `@ord-api/ord-api-types@1.0.${{ github.run_number }}`

            Install with npm:
            ```bash
            npm install @ord-api/ord-api-types@1.0.${{ github.run_number }}
            ```

            Install with pnpm:
            ```bash
            pnpm add @ord-api/ord-api-types@1.0.${{ github.run_number }}
            ```

            Or install the latest version:
            ```bash
            npm install @ord-api/ord-api-types@latest
            pnpm add @ord-api/ord-api-types@latest
            ```
          draft: false
          prerelease: false
