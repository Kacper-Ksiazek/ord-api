### General ###
server.port=${PORT}
spring.profiles.active=${SPRING_PROFILE}
spring.application.name=ord-backend
spring.jpa.properties.hibernate.jdbc.time_zone=UTC+1
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
### JWT
jwt.auth_cookie_name=AUTH-TOKEN
jwt.user_id_claim_name=user_id
jwt.secret_key=${JWT_SECRET_KEY}
jwt.expiration_time=${JWT_EXPIRATION_TIME}
### Open AI
openai.temperature=1
openai.max_tokens=4096
openai.api_key=${OPEN_AI_KEY}
openai.gpt_model=gpt-4o-mini
openai.api_url=https://api.openai.com/v1/chat/completions
