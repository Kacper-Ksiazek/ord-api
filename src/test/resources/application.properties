# Defaults for controller integration tests (smoke suite).
# Local overrides still come from .env.test when present.

spring.main.allow-bean-definition-overriding=true
spring.profiles.active=test

# Keep test output quiet — main application.properties sets DEBUG for local dev.
logging.level.root=WARN
logging.level.com.ord=WARN
logging.level.org.springframework=WARN
logging.level.org.springframework.web=WARN
logging.level.org.testcontainers=WARN
logging.level.org.flywaydb=WARN
logging.level.io.netty=WARN
logging.level.reactor.netty=WARN

ENV_TEST_PROPERTY=1test1

jwt.secret_key=test-jwt-secret-key-with-sufficient-length-for-hs256-algorithm
jwt.expiration_time=900
jwt.auth_cookie_name=AUTH-TOKEN
jwt.user_id_claim_name=user_id

openai.api_key=dummy-key
openai.api_url=https://api.openai.com/v1/responses
openai.max_tokens=4096
openai.temperature=1
openai.read_timeout_seconds=120
openai.connect_timeout_seconds=10
openai.write_timeout_seconds=60
openai.retry_max_attempts=3
openai.retry_backoff_seconds=2

elevenlabs.api_key=dummy-key
elevenlabs.api_url=https://api.elevenlabs.io/v1
elevenlabs.voice_id=dummy-voice-id

cors.allowed-origins=http://localhost:5173

email.from=noreply@test.com
