### General ###
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILE:default}
spring.application.name=ord-api
spring.flyway.baselineOnMigrate=true
### Database ###
spring.r2dbc.url=${DATABASE_URL_R2DBC:}
spring.r2dbc.username=${DATABASE_USERNAME:}
spring.r2dbc.password=${DATABASE_PASSWORD:}
### JWT
jwt.auth_cookie_name=AUTH-TOKEN
jwt.issuer=ord-api
jwt.user_id_claim_name=user_id
jwt.secret_key=${JWT_SECRET_KEY}
jwt.expiration_time=900
### Open AI
openai.temperature=1
openai.max_tokens=4096
openai.api_key=${OPEN_AI_KEY}
openai.gpt_model=gpt-4.1-mini
openai.api_url=https://api.openai.com/v1/responses
openai.price_per_mln_input_tokens=0.150
openai.price_per_mln_output_tokens=0.600
openai.maximum_number_of_open_ai_api_request_attempts=5
### Dev logging ###
logging.level.org.springframework.web=DEBUG
logging.level.com.ord=DEBUG
### Flyway ###
spring.flyway.url=${DATABASE_URL_JDBC:}
spring.flyway.user=${DATABASE_USERNAME:}
spring.flyway.password=${DATABASE_PASSWORD:}
spring.flyway.enabled=true
spring.flyway.baseline-version=0
spring.flyway.baseline-on-migrate=true
### SMTP / Mail ###
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
otp.expiration.minutes=10
otp.whitelisted-emails=${OTP_WHITELISTED_EMAILS:}
otp.code-for-whitelisted=${OTP_CODE_FOR_WHITELISTED_EMAILS:}
email.from=${EMAIL_FROM:noreply@ord-api.com}
### OpenAPI / Swagger ###
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.displayRequestDuration=true
springdoc.show-actuator=false
swagger.basic-auth.username=${SWAGGER_USERNAME:admin}
swagger.basic-auth.password=${SWAGGER_PASSWORD:admin}
