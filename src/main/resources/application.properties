### General ###
server.port=${PORT:8080}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:default}
spring.application.name=ord-api
spring.flyway.baselineOnMigrate=true
### CORS ###
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
### Database ###
spring.r2dbc.url=${DATABASE_URL_R2DBC:}
spring.r2dbc.username=${DATABASE_USERNAME:}
spring.r2dbc.password=${DATABASE_PASSWORD:}
### Session
session.cookie-name=AUTH-TOKEN
session.cookie-secure=false
session.cookie-same-site=Lax
session.idle-timeout=7d
session.absolute-timeout=30d
session.slide-interval=60s
### Open AI
openai.temperature=1
openai.max_tokens=8192
openai.api_key=${OPEN_AI_KEY}
openai.api_url=https://api.openai.com/v1/responses
openai.maximum_number_of_open_ai_api_request_attempts=5
openai.connect_timeout_seconds=10
openai.read_timeout_seconds=60
openai.write_timeout_seconds=60
openai.retry_max_attempts=3
openai.retry_backoff_seconds=2
### ElevenLabs TTS ###
elevenlabs.api_key=${ELEVENLABS_API_KEY}
elevenlabs.api_url=https://api.elevenlabs.io/v1
elevenlabs.model_id=eleven_turbo_v2_5
elevenlabs.output_format=mp3_44100_128
elevenlabs.optimize_streaming_latency=3
elevenlabs.connect_timeout_seconds=10
elevenlabs.read_timeout_seconds=120
elevenlabs.write_timeout_seconds=10
elevenlabs.retry_max_attempts=3
elevenlabs.retry_backoff_seconds=2
### Sentry ###
# Disabled when SENTRY_DSN is empty. Set SENTRY_DSN in .env for local verification.
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:development}
sentry.debug=${SENTRY_DEBUG:false}
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.0}
### Dev logging ###
logging.level.org.springframework.web=DEBUG
logging.level.com.ord=DEBUG
### Flyway ###
spring.flyway.url=${DATABASE_URL_JDBC:}
spring.flyway.user=${DATABASE_USERNAME:}
spring.flyway.password=${DATABASE_PASSWORD:}
spring.flyway.enabled=true
spring.flyway.baseline-version=0
spring.flyway.baseline-on-migrate=true
### SMTP / Mail ###
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
otp.expiration.minutes=10
otp.whitelisted-emails=${OTP_WHITELISTED_EMAILS:}
otp.code-for-whitelisted=${OTP_CODE_FOR_WHITELISTED_EMAILS:123456}
email.from=${EMAIL_FROM:noreply@ord-api.com}
email.app-public-url=${EMAIL_PUBLIC_BASE_URL:http://localhost:5173}
### E2E worker seeder (optional runtime repair; Flyway V22 is primary) ###
e2e.seeder.enabled=${E2E_SEEDER_ENABLED:false}
e2e.seeder.worker-count=${E2E_WORKER_COUNT:4}
e2e.seeder.email-prefix=${E2E_EMAIL_PREFIX:e2e-ci-w}
e2e.seeder.email-domain=${E2E_EMAIL_DOMAIN:ord.test}
### OpenAPI / Swagger ###
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.displayRequestDuration=true
springdoc.show-actuator=false
swagger.basic-auth.username=${SWAGGER_USERNAME:admin}
swagger.basic-auth.password=${SWAGGER_PASSWORD:admin}

