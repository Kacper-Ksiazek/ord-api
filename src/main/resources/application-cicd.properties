### CI/CD Profile Configuration ###
# This profile is used in GitHub Actions for OpenAPI spec generation and NPM publishing
# Only contains overrides - inherits everything else from application.properties

### Database - H2 In-Memory ###
spring.r2dbc.url=r2dbc:h2:mem:///testdb

### Flyway - Disabled for CI/CD ###
spring.flyway.enabled=false

### Logging - Less verbose for CI/CD ###
logging.level.org.springframework.web=INFO
logging.level.com.ord=INFO

### Environment Test Property ###
ENV_TEST_PROPERTY=1test1

### JWT - Dummy credentials for CI/CD ###
jwt.secret_key=dummy-secret-key-for-ci-cd-only-not-for-production

### OpenAI - Dummy key (not used in CI/CD) ###
openai.api_key=dummy-key

### SMTP - Disable starttls requirement for CI/CD ###
spring.mail.properties.mail.smtp.starttls.required=false