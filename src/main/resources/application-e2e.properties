# E2E runtime profile — Playwright CI backend (docker-compose.e2e.yml).
# Fixture-based OpenAI + ElevenLabs clients; no outbound calls to external AI APIs.
#
# Activate with: SPRING_PROFILES_ACTIVE=e2e

logging.level.org.springframework.web=INFO
logging.level.com.ord=INFO

otp.whitelisted-emails=${OTP_WHITELISTED_EMAILS:}
otp.code-for-whitelisted=${OTP_CODE_FOR_WHITELISTED_EMAILS:123456}

# Marker property for operators / docs (health check uses active profile directly).
ord.runtime-mode=e2e
